# Generated with JReleaser 1.27.0-SNAPSHOT at 2026-10-31T09:05:50.806631143Z
name: jreleaser
version: "1.27.0"
summary: Release projects quickly and easily with JReleaser
description: |
  JReleaser is a release automation tool. Its goal is to simplify creating releases and
  publishing artifacts to multiple package managers while providing customizable options.
  
  JReleaser takes inputs from popular builds tools (Ant, Maven, Gradle) such as JAR files,
  binary distributions (.zip, .tar), JLink images, or any other file that you’d like to
  publish as a Git release on popular Git services such as GitHub, GitLab, or Gitea.
  Distribution files may additionally be published to be consumed by popular package managers
  such as Homebrew, Chocolatey, Snapcraft, or get ready to be launched via JBang. Releases
  may be announced in a variety of channels such as Twitter, Zulip, SDKMAN!, and more.

title: Jreleaser
license: Apache-2.0
issues: https://github.com/jreleaser/jreleaser/issues
source-code: https://github.com/jreleaser/jreleaser
website: https://jreleaser.org

grade: stable
confinement: strict
base: core24
type: app

platforms:
  amd64:
    build-on: [amd64, arm64]
    
apps:
  jreleaser:
    command: bin/jreleaser
    environment:
      JAVA_HOME: "$SNAP/usr/lib/jvm/java-8-openjdk-${SNAP_ARCH}"
      PATH: "$SNAP/bin:$PATH:$JAVA_HOME/bin"
    plugs:
      - dot-config-files
      - network
      - home

plugs:
  dot-config-files:
    interface: personal-files
    read:
      - $HOME/.gnupg
      - $HOME/.gitconfig
      - $HOME/.config/jgit
    write:
      - $HOME/.jreleaser
parts:
  jreleaser:
    plugin: dump
    source: https://github.com/jreleaser/jreleaser/releases/download/v1.27.0/jreleaser-1.27.0.tar
    source-checksum: sha256/9cff09b7825713379ed7b4ccc81c6dabfd2e99e867c52bc8fbc4bb0f8d673a88
    stage-packages:
      - curl
      - openjdk-8-jre
      - ca-certificates
      - ca-certificates-java
    organize:
      'usr/lib/jvm/java-*': 'usr/lib/jvm/java'
    prime:
      - -usr/lib/jvm/java/lib/security/cacerts
